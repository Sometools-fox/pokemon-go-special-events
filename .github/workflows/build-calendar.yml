name: Build ICS Calendar

on:
  push:
    branches: [main]
    paths:
      - "data/events.json"
      - "scripts/build_calendar.py"
      - ".github/workflows/build-calendar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate calendar.ics
        run: python scripts/build_calendar.py
      - name: Commit calendar
        run: |
          if [ -z "$(git status --porcelain calendar.ics)" ]; then
            echo "Calendar already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git commit -m "Update ICS calendar"
          git pull --rebase origin main
          git push origin HEAD:main
