name: Fetch Inbox Images

on:
  workflow_dispatch:
  push:
    paths:
      - "inbox/incoming/**"
      - ".github/workflows/storage-image-poc.yml"

permissions:
  contents: write

jobs:
  fetch-inbox-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cloud Storage client
        run: pip install google-cloud-storage==3.4.1

      - name: Restore reader credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_B64"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 --decode > "$RUNNER_TEMP/firebase-reader.json"

      - name: Download pending Inbox images
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-reader.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from google.cloud import storage

          root = Path("inbox/incoming")
          out = Path("/tmp/firebase-inbox-images")
          client = storage.Client(project="pokemon-go-special-events")
          bucket = client.bucket("pokemon-go-special-events.firebasestorage.app")
          count = 0

          for meta in root.glob("*.json"):
              if meta.name == "index.json":
                  continue
              data = json.loads(meta.read_text(encoding="utf-8"))
              item_id = data.get("clientItemId", meta.stem)
              for i, attachment in enumerate(data.get("attachments") or [], 1):
                  storage_path = attachment.get("storagePath")
                  if not storage_path:
                      continue
                  suffix = Path(storage_path).suffix.lower()
                  if suffix not in {".jpg", ".jpeg", ".png", ".webp"}:
                      suffix = ".jpg"
                  target = out / item_id / f"{i:02d}{suffix}"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  bucket.blob(storage_path).download_to_filename(str(target))
                  count += 1

          print(f"Downloaded {count} Inbox image(s).")
          Path("/tmp/inbox-image-count").write_text(str(count), encoding="utf-8")
          PY

      - name: Publish latest image run locator
        if: success()
        run: |
          mkdir -p inbox
          printf '{\n  "workflow": "Fetch Inbox Images",\n  "runId": "%s",\n  "runAttempt": "%s",\n  "commitSha": "%s",\n  "imageCount": %s\n}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$(cat /tmp/inbox-image-count)" > inbox/latest-image-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/latest-image-run.json
          if ! git diff --cached --quiet; then
            git commit -m "Update latest Inbox image run locator"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Check downloaded image count
        id: images
        run: echo "count=$(cat /tmp/inbox-image-count)" >> "$GITHUB_OUTPUT"

      - name: Upload temporary private Inbox images
        if: steps.images.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: firebase-inbox-images
          path: /tmp/firebase-inbox-images
          retention-days: 1
          if-no-files-found: error
