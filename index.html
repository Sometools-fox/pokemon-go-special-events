<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Pokémon GO 特殊活動</title><link rel="stylesheet" href="style.css?v=20261006-1"></head><body>
<div class="appShell"><aside class="desktopSide"><div class="sidebrand"><h1>Pokémon GO 特殊活動</h1><p>快速查活動、特殊獲取物與 GPS</p></div></aside><div class="mainPane"><header><div class="wrap"><h1>Pokémon GO 特殊活動</h1><p>快速查活動、特殊獲取物與 GPS</p></div></header>
<main class="wrap"><section class="toolbar">
<input id="q" type="search" placeholder="搜尋活動、地點、特殊獲取物…">
<div class="quick" id="quick"><button data-status="" class="on">全部</button><button data-status="active">進行中</button><button data-status="upcoming">即將開始</button><button data-status="ended">已結束</button></div>
<div class="filters"><select id="region" aria-label="地區"><option value="">全部地區</option></select><details class="rewardfilter" id="rewardFilter"><summary id="rewardSummary">全部特殊獲取物</summary><div class="rewardmenu" id="rewardMenu"></div></details><label class="toggle"><input id="gpsOnly" type="checkbox"> 有 GPS</label></div>
<details class="calendarbox"><summary class="btn calendarbtn">📅 Google 日曆訂閱</summary><div class="calendarhelp"><div>① 複製 ICS 訂閱網址</div><div>② Google Calendar「其他日曆」→「透過網址」</div><div>③ 貼上網址並新增日曆</div><input id="calendarUrl" class="calendarurl" type="text" readonly value="https://sometools-fox.github.io/pokemon-go-special-events/calendar.ics"><button id="copyCalendarUrl" class="btn primary" type="button">複製訂閱網址</button></div></details>
</section><div class="summary" id="summary"></div><div id="events"></div><div id="empty" class="empty" hidden>找不到符合條件的活動</div></main></div></div>
<div id="toast" class="toast"></div><script src="app.js?v=20261006-1"></script></body></html>
